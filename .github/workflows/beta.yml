# Every push to the beta branch builds the site for the /beta path and
# publishes it to dannycordoba.com/beta/. The live site at the root is untouched.

name: Beta preview

on:
  push:
    branches: [ "beta" ]

permissions:
  contents: write

concurrency:
  group: beta-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout beta
      uses: actions/checkout@v4
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Build for /beta
      env:
        PUBLIC_URL: /beta
        # Show unfinished [TODO] content and keep the preview out of search engines
        REACT_APP_SHOW_TODO: 'true'
        REACT_APP_ROBOTS: noindex,nofollow
      run: npm run build
    - name: Git config user
      uses: snow-actions/git-config-user@v1.0.0
    - name: Configure deploy auth
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
    - name: Publish to /beta
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # --dest beta writes into the beta/ folder of gh-pages; --add keeps the
      # live site and its CNAME in place instead of wiping the branch.
      run: npx gh-pages -d build --dest beta --add --dotfiles -m "Deploy beta preview"
    - name: Turn off Jekyll for the whole site
      # GitHub Pages runs Jekyll unless .nojekyll sits at the site root. Jekyll
      # turns markdown files with a --- header into HTML pages, which breaks the
      # content files the site fetches.
      run: |
        mkdir -p site-root && touch site-root/.nojekyll
        npx gh-pages -d site-root --add --dotfiles -m "Disable Jekyll"
